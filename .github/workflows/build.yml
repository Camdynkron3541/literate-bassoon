name: Build Mountains Bets (JX Menu)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mountainsbets-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  build:
    name: Unzip + build netstandard2.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-mbt-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-mbt-
            nuget-${{ runner.os }}-

      - name: Find and extract zip(s)
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/mbt-src"
          mkdir -p "$WORK"

          mapfile -t ZIPS < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' ! -path '*/.git/*' | sort)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            # also allow already-unpacked tree in repo
            if find "$GITHUB_WORKSPACE" -name 'StupidTemplate.csproj' | grep -q .; then
              echo "No zips; using checked-out tree"
              WORK="$GITHUB_WORKSPACE"
            else
              echo "No .zip files and no StupidTemplate.csproj in the repository."
              exit 1
            fi
          else
            echo "Found ${#ZIPS[@]} zip(s):"
            for z in "${ZIPS[@]}"; do
              echo "  $z ($(du -h "$z" | cut -f1))"
              unzip -qo "$z" -d "$WORK"
            done
          fi

          CSPROJ=$(find "$WORK" -type f -name 'StupidTemplate.csproj' | head -n1)
          if [ -z "$CSPROJ" ]; then
            CSPROJ=$(find "$WORK" -type f -name '*.csproj' ! -name '*Test*' | head -n1)
          fi
          if [ -z "$CSPROJ" ]; then
            echo "Tree under $WORK:"
            find "$WORK" -maxdepth 4 -type f | head -80
            echo "No StupidTemplate.csproj found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CSPROJ")
          {
            echo "project_dir=$PROJECT_DIR"
            echo "csproj=$CSPROJ"
            echo "work=$WORK"
          } >> "$GITHUB_OUTPUT"
          echo "Project dir: $PROJECT_DIR"
          echo "csproj: $CSPROJ"

      - name: Resolve references
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ steps.extract.outputs.work }}"
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"

          # Prefer bundled References/ next to the csproj (shipped in the template zip)
          LOCAL_MANAGED="$PROJECT_DIR/References/Managed"
          LOCAL_BEPINEX="$PROJECT_DIR/References/BepInEx/core"

          if [ -d "$LOCAL_MANAGED" ] && [ -f "$LOCAL_MANAGED/Assembly-CSharp.dll" ]; then
            echo "Using bundled References/ from template"
            MANAGED="$LOCAL_MANAGED"
            BEPINEX="$LOCAL_BEPINEX"
            mkdir -p "$BEPINEX"
          else
            echo "No bundled References — staging from extracted DLLs"
            REFS="$WORK/_refs"
            MANAGED="$REFS/Managed"
            BEPINEX="$REFS/BepInEx/core"
            mkdir -p "$MANAGED" "$BEPINEX"
            BEPINEX_NAMES='^(0Harmony|BepInEx|HarmonyXInterop|Mono\.Cecil|MonoMod\.)'
            while IFS= read -r -d '' dll; do
              base=$(basename "$dll")
              if echo "$base" | grep -Eq "$BEPINEX_NAMES"; then
                cp -n "$dll" "$BEPINEX/" 2>/dev/null || true
              else
                cp -n "$dll" "$MANAGED/" 2>/dev/null || true
              fi
            done < <(find "$WORK" -type f -name '*.dll' ! -path '*/_refs/*' -print0)
          fi

          echo "Managed: $(find "$MANAGED" -name '*.dll' | wc -l) DLLs"
          echo "BepInEx core: $(find "$BEPINEX" -name '*.dll' 2>/dev/null | wc -l) DLLs"

          NEED=(Assembly-CSharp.dll UnityEngine.CoreModule.dll BepInEx.dll 0Harmony.dll)
          MISSING=()
          for r in "${NEED[@]}"; do
            if [ ! -f "$MANAGED/$r" ] && [ ! -f "$BEPINEX/$r" ]; then
              MISSING+=("$r")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Missing: ${MISSING[*]}"
            ls "$MANAGED" | head -30
            ls "$BEPINEX" 2>/dev/null || true
            exit 1
          fi

          # Force props at project root so HintPaths resolve (even if Exists() is flaky on runner)
          cat > "$PROJECT_DIR/Directory.Build.props" << EOF
          <?xml version="1.0" encoding="utf-8" ?>
          <Project>
            <PropertyGroup>
              <GamePath>$PROJECT_DIR/References</GamePath>
              <GameAssemblyPath>$MANAGED</GameAssemblyPath>
              <BepInExAssemblyPath>$BEPINEX</BepInExAssemblyPath>
              <PluginsPath>$PROJECT_DIR/References/BepInEx/plugins</PluginsPath>
            </PropertyGroup>
          </Project>
          EOF
          sed -i 's/^          //' "$PROJECT_DIR/Directory.Build.props"
          cat "$PROJECT_DIR/Directory.Build.props"

      - name: Restore
        run: dotnet restore "${{ steps.extract.outputs.csproj }}" --verbosity minimal

      - name: Build Release
        run: |
          dotnet build "${{ steps.extract.outputs.csproj }}" \
            -c "$CONFIGURATION" \
            --no-restore \
            -p:WarningLevel=0 \
            -p:TreatWarningsAsErrors=false \
            -v:m

      - name: Locate output DLL
        id: out
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"
          FOUND=""
          for c in \
            "$PROJECT_DIR/bin/Release/netstandard2.1/StupidTemplate.dll" \
            "$PROJECT_DIR/bin/Release/StupidTemplate.dll" \
            "$PROJECT_DIR/bin/Release/netstandard2.1/MountainsBets.dll"
          do
            [ -f "$c" ] && FOUND="$c" && break
          done
          if [ -z "$FOUND" ]; then
            FOUND=$(find "$PROJECT_DIR/bin" -type f -name '*.dll' \
              ! -name 'System.*' ! -name 'Microsoft.*' ! -name 'netstandard.dll' \
              2>/dev/null | head -n1 || true)
          fi
          if [ -z "$FOUND" ] || [ ! -f "$FOUND" ]; then
            find "$PROJECT_DIR" -name '*.dll' 2>/dev/null | head -40
            echo "DLL not found after build"
            exit 1
          fi
          SIZE=$(stat -c%s "$FOUND")
          echo "Built: $FOUND ($(( SIZE / 1024 )) KB)"
          echo "dll=$FOUND" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FOUND")" >> "$GITHUB_OUTPUT"

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ steps.out.outputs.dll }}" "dist/${{ steps.out.outputs.name }}"
          cat > dist/README.txt << EOF
          Mountains Bets — JX MODDING GAME PCVR menu
          Unity 2021.3.21 / BepInEx / netstandard2.1

          Drop ${{ steps.out.outputs.name }} into:
            .../jxmoddinggame/BepInEx/plugins/

          Built by GitHub Actions on ${GITHUB_SHA:0:7}
          EOF

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: MountainsBets-JX-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### Mountains Bets build
          - Source: StupidTemplate + bundled References (UnitySubsystems + BepInEx core)
          - Target: netstandard2.1
          - DLL: \`${{ steps.out.outputs.name }}\`
          - Size: $(( ${{ steps.out.outputs.size }} / 1024 )) KB
          - Artifact: \`MountainsBets-JX-${{ github.sha }}\`
          EOF
